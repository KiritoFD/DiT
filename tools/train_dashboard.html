<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiT 训练监控 · Diff Loss</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="hammer.min.js"></script>
<script src="chartjs-plugin-zoom.min.js"></script>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --line:#2a2f3c; --txt:#e6e9ef; --dim:#8b93a7; --acc:#4f9cff; --warn:#ff6b6b; --ok:#3ddc97; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  .meta { color:var(--dim); font-size:13px; }
  .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button.sec { background:var(--card); border:1px solid var(--line); color:var(--txt); }
  .auto { color:var(--dim); font-size:13px; display:flex; align-items:center; gap:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; padding:20px 24px 4px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat .k { color:var(--dim); font-size:12px; }
  .stat .v { font-size:24px; font-weight:700; margin-top:4px; }
  .v.warn { color:var(--warn); } .v.ok { color:var(--ok); }
  .charts { padding:12px 24px 24px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:900px){ .charts{grid-template-columns:1fr;} }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .panel h2 { font-size:14px; margin:0 0 12px; font-weight:600; color:var(--txt); }
  .chartbox { position:relative; height:300px; }
  .status { padding:0 24px 12px; color:var(--dim); font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; margin-left:8px; }
  .badge.nan { background:rgba(255,107,107,.15); color:var(--warn); }
  .badge.ok { background:rgba(61,220,151,.15); color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>DiT-3Cond 训练监控</h1>
  <span class="meta" id="meta">未加载</span>
  <div class="controls">
    <span class="meta" id="countdown"></span>
    <span class="meta" style="color:var(--dim);font-size:12px;">默认显示全部 step · 滚轮缩放局部 · 拖动平移 · 双击图卡重置该图</span>
    <button class="sec" id="resetZoomBtn">↩ 重置缩放</button>
    <label class="auto"><input type="checkbox" id="autoChk" checked> 自动刷新(10s)</label>
    <button class="sec" id="refreshBtn">⟳ 立刻刷新</button>
  </div>
</header>

<div class="grid" id="statGrid"></div>
<div class="status" id="statusLine"></div>

<div class="charts" style="grid-template-columns:1fr;">
  <div class="panel">
    <h2>Eval 历史取样海报（一行=一个 ckpt 向下延伸 · 每样本 img|canny|skel · 末行 GT）</h2>
    <div style="max-width:680px;">
      <img id="posterImg" alt="eval 历史取样海报（尚未生成）" style="width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#000;" />
    </div>
  </div>
</div>

<div class="charts">
  <div class="panel">
    <h2>Diff Loss（核心指标）</h2>
    <div class="chartbox"><canvas id="diffChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>Total Loss</h2>
    <div class="chartbox"><canvas id="totalChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>结构 Loss：Canny / Skel / REPA</h2>
    <div class="chartbox"><canvas id="structChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>吞吐 Steps/Sec</h2>
    <div class="chartbox"><canvas id="spdChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>显存 GB（当前 / 峰值）</h2>
    <div class="chartbox"><canvas id="memChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>Auto-Eval：MSE（越低越好）</h2>
    <div class="chartbox"><canvas id="mseChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>Auto-Eval：SSIM（越高越好）</h2>
    <div class="chartbox"><canvas id="ssimChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>X0Lat：预测干净 latent vs GT latent 的 MSE（越低越好）</h2>
    <div class="chartbox"><canvas id="x0Chart"></canvas></div>
  </div>
</div>

<script>
const COLORS = { diff:'#4f9cff', total:'#ffb84f', canny:'#ff6b6b', skel:'#b06bff', repa:'#3ddc97', spd:'#8b93a7' };
let charts = {};
let chartsBuilt = false;

// 注册 zoom 插件（chartjs-plugin-zoom 需要 hammer.js 已引入）
if(typeof ChartZoom !== 'undefined'){
  Chart.register(ChartZoom);
}

function makeChart(id, datasets){
  const ctx = document.getElementById(id);
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type:'line',
    data:{ labels:[], datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ labels:{ color:'#e6e9ef', boxWidth:12 } },
        tooltip:{
          callbacks:{
            title:(items)=>{
              const it = items[0];
              const ts = it.dataset._ts ? it.dataset._ts[it.dataIndex] : '';
              const step = it.label;
              return (ts ? (ts + '  ') : '') + 'step ' + step;
            }
          }
        },
        zoom:{
          pan:{ enabled:true, mode:'x' },
          zoom:{ wheel:{ enabled:true, speed:0.08 }, pinch:{ enabled:true }, mode:'x' },
          // 双击图表重置该图缩放；animation.duration 去掉（保持立即响应）
        }
      },
      scales:{
        x:{ ticks:{ color:'#8b93a7', maxTicksLimit:12 }, grid:{ color:'#2a2f3c' } },
        y:{ ticks:{ color:'#8b93a7' }, grid:{ color:'#2a2f3c' } }
      }
    }
  });
}
function resetZoomAll(){
  Object.values(charts).forEach(c=>{ if(c && c.resetZoom) c.resetZoom(); });
}
function ds(label, color, key){
  return { label, data:[], borderColor:color, backgroundColor:color+'22',
           borderWidth:2, pointRadius:0, tension:0.25, spanGaps:true, _key:key };
}
function fmtTs(r){
  // 优先用日志真实时间戳（带日期），缺失时回退到 step 序号
  return r.ts ? r.ts.slice(5) : ('#'+r.step);  // MM-DD HH:MM:SS
}
// useStep=true：横轴用 step（loss/eval 类）；false：横轴用时间（吞吐图）
function fill(chart, rows, useStep){
  chart.data.labels = rows.map(r => useStep ? r.step : fmtTs(r));
  // 每个 dataset 携带 ts 数组，供 tooltip 悬浮展示时间
  chart.data.datasets.forEach(d=>{
    d.data = rows.map(r=>r[d._key]);
    d._ts = rows.map(r => r.ts || '');
  });
  chart.update();
}

let lastPullText = '';
async function loadPoster(){
  try {
    const res = await fetch('eval_poster.png?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const img = document.getElementById('posterImg');
    img.src = url;
    img.onload = () => URL.revokeObjectURL(url);
  } catch(e){ /* 尚无海报时留空 */ }
}
async function load(){
  try {
    const res = await fetch('train_data.json?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    lastPullText = `来源 ${data.source} · 拉取于 ${data.pulledAt} · 记录 ${data.count} 条`;
    document.getElementById('meta').textContent = lastPullText;

    const rows = data.rows || [];
    if(rows.length){
      if(!chartsBuilt){
        makeChart('diffChart',   [ds('Diff','#4f9cff','diff')]);
        makeChart('totalChart',  [ds('Total','#ffb84f','total')]);
        makeChart('structChart', [ds('Canny',COLORS.canny,'canny'), ds('Skel',COLORS.skel,'skel'), ds('REPA',COLORS.repa,'repa')]);
        makeChart('spdChart',    [ds('Steps/Sec',COLORS.spd,'stepsPerSec')]);
        makeChart('memChart',    [ds('当前',COLORS.canny,'memCur'), ds('峰值',COLORS.skel,'memPeak')]);
        makeChart('mseChart',    [ds('MSE','#ff6b6b','mse')]);
        makeChart('ssimChart',   [ds('SSIM','#3ddc97','ssim')]);
        makeChart('x0Chart',     [ds('X0Lat','#ffb84f','x0lat')]);
        chartsBuilt = true;
      }
      // loss / eval 类图：横轴用 step；吞吐图（spdChart）：横轴用时间
      // fill 只原位更新数据，不销毁图表 => 用户缩放/平移会在刷新后保留
      ['diffChart','totalChart','structChart','mseChart','ssimChart','memChart','x0Chart'].forEach(c=>fill(charts[c], rows, true));
      fill(charts['spdChart'], rows, false);

      // 统计卡片
      const last = rows[rows.length-1];
      const isNan = v => v===null || v===undefined || Number.isNaN(v);
      const stat = (k,v,cls)=>`<div class="stat"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`;
      let badge = '';
      if(!isNan(last.diff) && isNan(last.mse)){
        // 标准训练模式：看 diff
        if(isNan(last.diff)) badge = '<span class="badge nan">⚠ NaN 崩溃</span>';
        else if(rows.length>5 && !isNan(rows[0].diff) && last.diff < rows[0].diff) badge = '<span class="badge ok">✓ 下降中</span>';
      } else if(!isNan(last.mse)){
        // auto-eval 模式：看 ssim 是否稳定/上升
        badge = '<span class="badge ok">✓ auto-eval 在线</span>';
      }
      // 计算 diff 起点->末点变化（仅标准训练模式有意义）
      const finite = rows.filter(r=>!isNan(r.diff));
      const firstD = finite.length?finite[0].diff:null;
      const trend = (firstD!==null && !isNan(last.diff)) ? ((last.diff-firstD)/firstD*100) : null;
      const lastTs = last.ts ? last.ts : '—';
      const isAutoEvalMode = !isNan(last.mse);  // 有 auto-eval 指标 => 验证模式
      document.getElementById('statGrid').innerHTML =
        stat('最新 Step', last.step) +
        stat('最新日志时间', lastTs) +
        stat('Diff(末)', isAutoEvalMode?'N/A':(isNan(last.diff)?'<span class="v warn">NaN</span>':'<span class="v warn">'+last.diff.toFixed(4)+'</span>'), isAutoEvalMode?'':(isNan(last.diff)?'warn':'')) +
        stat('Diff 变化', isAutoEvalMode?'N/A':(trend===null?'—':(trend>0?'+':'')+trend.toFixed(1)+'%'), isAutoEvalMode?'':(trend<0?'ok':'warn')) +
        stat('Auto-Eval MSE', isNan(last.mse)?'—':last.mse.toFixed(5), isNan(last.mse)?'':'warn') +
        stat('Auto-Eval SSIM', isNan(last.ssim)?'—':last.ssim.toFixed(4), isNan(last.ssim)?'':'ok') +
        stat('Total(末)', isNan(last.total)?'—':last.total.toFixed(4), isNan(last.total)?'':'warn') +
        stat('Steps/Sec', isNan(last.stepsPerSec)?'—':last.stepsPerSec.toFixed(2)) +
        stat('状态', badge?(badge.textContent||'告警'):'正常', '');
      let statusTxt = '';
      if(!isAutoEvalMode && !isNan(last.diff)){
        statusTxt += 'Diff 起点 '+(firstD!==null?firstD.toFixed(4):'—')+' → 末点 '+last.diff.toFixed(4)+badge;
      }
      if(isAutoEvalMode){
        statusTxt += '验证模式(auto-eval 在线) · MSE='+last.mse.toFixed(5)+' SSIM='+last.ssim.toFixed(4);
      }
      document.getElementById('statusLine').innerHTML = statusTxt || '等待数据…';
    }
    loadPoster();
  } catch(e){
    document.getElementById('meta').textContent = '加载失败: '+e.message+'（请用本地 http 服务打开，见说明）';
  }
}

document.getElementById('refreshBtn').addEventListener('click', () => {
  load();            // 立刻向 train_data.json 拉取并刷新曲线
  secLeft = 10;      // 重置倒计时到满格
});
// “↩ 重置缩放”按钮：重置所有图表到原始范围
document.getElementById('resetZoomBtn').addEventListener('click', resetZoomAll);
// 倒计时：前端每隔 1s 刷新显示；load 实际每 10s 拉一次
let secLeft = 10;
let timer = null, cdTimer = null;
const REFRESH_MS = 10000;
const autoChk = document.getElementById('autoChk');
function tickCountdown(){
  secLeft = secLeft <= 0 ? 10 : secLeft - 1;
  const cd = document.getElementById('countdown');
  if(cd) cd.textContent = autoChk.checked ? `下次刷新 ${secLeft}s` : '自动刷新已关';
}
function syncAuto(){
  if(autoChk.checked){
    if(!timer) timer=setInterval(load, REFRESH_MS);
    if(!cdTimer){ secLeft = 10; cdTimer=setInterval(tickCountdown, 1000); }
  } else {
    if(timer){ clearInterval(timer); timer=null; }
    if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
    const cd = document.getElementById('countdown');
    if(cd) cd.textContent = '自动刷新已关';
  }
}
autoChk.addEventListener('change', syncAuto);
load(); syncAuto();
</script>
</body>
</html>
