<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiT 训练监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0f1117; --card:#1a1d27; --line:#2a2f3c; --txt:#e6e9ef; --dim:#8b93a7;
  --acc:#4f9cff; --warn:#ff6b6b; --ok:#3ddc97; --track:#3a4150;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.5}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600}
.meta{color:var(--dim);font-size:12px}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
button.sec{background:var(--card);border:1px solid var(--line);color:var(--txt)}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;margin-left:6px}
.badge.nan{background:rgba(255,107,107,.15);color:var(--warn)}
.badge.ok{background:rgba(61,220,151,.15);color:var(--ok)}

/* 统计卡片 */
.stats{display:flex;gap:10px;padding:14px 20px 0;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:110px}
.stat .k{color:var(--dim);font-size:11px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.v.warn{color:var(--warn)} .v.ok{color:var(--ok)}

/* 图表网格 */
.charts{padding:14px 20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel h2{font-size:13px;margin:0 0 10px;font-weight:600}
.chart-wrap{position:relative;height:260px}

/* 缩放控制条：左右两个独立滑块轨道 */
.zoom-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.zbar{flex:1;display:flex;flex-direction:row;gap:8px}
.zbar input[type=range]{flex:1;width:auto;margin:0;-webkit-appearance:none;appearance:none;
  height:4px;background:var(--track);border-radius:2px;outline:none}
.zbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;cursor:pointer;border:2px solid var(--bg)}
.zbar-lo input::-webkit-slider-thumb{background:var(--ok)}
.zbar-hi input::-webkit-slider-thumb{background:var(--warn)}
.zoom-btn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer}
.zoom-btn:hover{color:var(--txt);border-color:var(--dim)}

.status{padding:0 20px 10px;color:var(--dim);font-size:12px}

/* 海报 */
.poster-section{padding:14px 20px 0}
.poster-section .panel{margin-bottom:14px}
.poster-section img{width:100%;max-width:600px;border-radius:6px;border:1px solid var(--line);display:block;background:#000}

/* Tab 切换 */
.tabs{display:flex;gap:0;padding:14px 20px 0;border-bottom:1px solid var(--line)}
.tab{padding:8px 16px;font-size:12px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--txt);border-bottom-color:var(--acc);font-weight:600}
.tab:hover{color:var(--txt)}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>

<header>
  <h1>DiT-3Cond 训练监控</h1>
  <span class="meta" id="meta">未加载</span>
  <div class="controls">
    <span class="meta" id="countdown"></span>
    <label class="meta"><input type="checkbox" id="autoChk" checked> 自动刷新(10s)</label>
    <button class="sec" id="refreshBtn">刷新</button>
  </div>
</header>

<div class="stats" id="statGrid"></div>
<div class="status" id="statusLine"></div>

<!-- Tab 导航 -->
<div class="tabs">
  <div class="tab active" data-tab="loss">Loss 曲线</div>
  <div class="tab" data-tab="eval">评估指标</div>
  <div class="tab" data-tab="sys">系统 / 海报</div>
</div>

<!-- Tab: Loss -->
<div class="tab-content active" id="tab-loss">
<div class="charts">
  <div class="panel">
    <h2>Diff Loss（核心指标）</h2>
    <div class="chart-wrap"><canvas id="diffChart"></canvas></div>
    <div class="zoom-bar" data-for="diffChart">
      <button class="zoom-btn" onclick="zoomOut(this)">−</button>
      <div class="zbar zbar-lo"><input type="range" class="zlo" min="0" max="100" value="0" step="0.5"></div>
      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>
      <button class="zoom-btn" onclick="zoomIn(this)">+</button>
      <button class="zoom-btn sec" onclick="resetZoom(this)">重置</button>
    </div>
  </div>
  <div class="panel">
    <h2>Total Loss</h2>
    <div class="chart-wrap"><canvas id="totalChart"></canvas></div>
    <div class="zoom-bar" data-for="totalChart">
      <button class="zoom-btn" onclick="zoomOut(this)">−</button>
      <div class="zbar zbar-lo"><input type="range" class="zlo" min="0" max="100" value="0" step="0.5"></div>
      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>
      <button class="zoom-btn" onclick="zoomIn(this)">+</button>
      <button class="zoom-btn sec" onclick="resetZoom(this)">重置</button>
    </div>
  </div>
  <div class="panel">
    <h2>结构 Loss：Canny / Skel / REPA</h2>
    <div class="chart-wrap"><canvas id="structChart"></canvas></div>
    <div class="zoom-bar" data-for="structChart">
      <button class="zoom-btn" onclick="zoomOut(this)">−</button>
      <div class="zbar zbar-lo"><input type="range" class="zlo" min="0" max="100" value="0" step="0.5"></div>
      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>
      <button class="zoom-btn" onclick="zoomIn(this)">+</button>
      <button class="zoom-btn sec" onclick="resetZoom(this)">重置</button>
    </div>
  </div>
</div>
</div>

<!-- Tab: Eval -->
<div class="tab-content" id="tab-eval">
<div class="charts">
  <div class="panel">

    <div class="chart-wrap"><canvas id="mseChart"></canvas></div>
    <div class="zoom-bar" data-for="mseChart">

      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>

    <h2>Auto-Eval SSIM（越高越好）</h2>
    <div class="chart-wrap"><canvas id="ssimChart"></canvas></div>
    <div class="zoom-bar" data-for="ssimChart">
      <button class="zoom-btn" onclick="zoomOut(this)">−</button>
      <div class="zbar zbar-lo"><input type="range" class="zlo" min="0" max="100" value="0" step="0.5"></div>
      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>

      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>
      <button class="zoom-btn" onclick="zoomIn(this)">+</button>
      <button class="zoom-btn sec" onclick="resetZoom(this)">重置</button>
    </div>
  </div>
</div>
</div>

<!-- Tab: System -->
<div class="tab-content" id="tab-sys">
<div class="charts">
  <div class="panel">
    <h2>吞吐 Steps/Sec</h2>
    <div class="chart-wrap"><canvas id="spdChart"></canvas></div>
    <div class="zoom-bar" data-for="spdChart">
      <button class="zoom-btn" onclick="zoomOut(this)">−</button>
      <div class="zbar zbar-lo"><input type="range" class="zlo" min="0" max="100" value="0" step="0.5"></div>
      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>
      <button class="zoom-btn" onclick="zoomIn(this)">+</button>
      <button class="zoom-btn sec" onclick="resetZoom(this)">重置</button>
    </div>
  </div>
  <div class="panel">
    <h2>显存 GB（当前 / 峰值）</h2>
    <div class="chart-wrap"><canvas id="memChart"></canvas></div>
    <div class="zoom-bar" data-for="memChart">
      <button class="zoom-btn" onclick="zoomOut(this)">−</button>
      <div class="zbar zbar-lo"><input type="range" class="zlo" min="0" max="100" value="0" step="0.5"></div>
      <div class="zbar zbar-hi"><input type="range" class="zhi" min="0" max="100" value="100" step="0.5"></div>
      <button class="zoom-btn" onclick="zoomIn(this)">+</button>
      <button class="zoom-btn sec" onclick="resetZoom(this)">重置</button>
    </div>

</div>
<div class="poster-section">
  <div class="panel">
    <h2>Eval 取样海报（每行 = 一个 ckpt · img|canny|skel · 末行 GT）</h2>
    <img id="posterImg" alt="eval 海报" style="display:block;" />
  </div>
</div>

<script>
// ============================================================
// 配置常量
// ============================================================
const COLORS = {
  diff:'#4f9cff', total:'#ffb84f', canny:'#ff6b6b',
  skel:'#b06bff', repa:'#3ddc97', spd:'#8b93a7'
};
const MAX_DISPLAY_POINTS = 2000;   // 超过此数自动降采样
const REFRESH_MS = 10000;

// ============================================================
// 全局状态
// ============================================================
const charts = {};       // {id: Chart实例}
const chartMeta = {};    // {id: {fullData, fullLabels, fullTs, viewStart, viewEnd}}
let chartsBuilt = false;
let allRows = [];        // 原始全量数据
let rafPending = null;   // requestAnimationFrame 节流

// ============================================================
// 数据降采样：均匀采样到 targetCount 点
// ============================================================
function downsample(arr, labels, ts, target) {
  if (arr.length <= target) return {data:arr, labels, ts};
  const step = arr.length / target;
  const outData = [], outLabels = [], outTs = [];
  for (let i = 0; i < target; i++) {
    const idx = Math.min(Math.floor(i * step), arr.length - 1);
    outData.push(arr[idx]);
    outLabels.push(labels[idx]);
    outTs.push(ts[idx]);
  }
  return {data:outData, labels:outLabels, ts:outTs};
}

// ============================================================
// 创建图表（无 zoom 插件依赖）
// ============================================================
function makeChart(id, datasets) {
  const ctx = document.getElementById(id);
  if (!ctx) return null;

  if (charts[id]) charts[id].destroy();

  const ch = new Chart(ctx, {
    type:'line',
    data:{ labels:[], datasets: datasets.map(d => ({
      label:d.label, data:[], borderColor:d.color,
      backgroundColor:d.color+'18', borderWidth:1.5,
      pointRadius:0, tension:0.2, spanGaps:true, _key:d.key
    }))},
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{duration:0},          // 关闭动画防卡顿
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ labels:{ color:'#8b93a7', boxWidth:12, font:{size:11} }, position:'top' },
        tooltip:{ callbacks:{
          title(items){
            const it = items[0];
            const t = it.dataset._rawTs ? it.dataset._rawTs[it.dataIndex] : '';
            return (t ? t+'  ':'') + 'step '+it.label;
          }
        }}
      },
      scales:{
        x:{ ticks:{ color:'#8b93a7', maxTicksLimit:10, font:{size:10} },
             grid:{ color:'#2a2f3c' } },
        y:{ ticks:{ color:'#8b93a7', font:{size:10} },
             grid:{ color:'#2a2f3c' } }
      }
    }
  });
  charts[id] = ch;
  chartMeta[id] = {
    fullData:[], keys: datasets.map(d=>d.key),
    fullLabels:[], fullTs:[], viewStart:0, viewEnd:1
  };

  // 绑定缩放条的 range 输入
  bindZoomBar(id);
  return ch;
}

// ============================================================
// 缩放条绑定：range slider ↔ 图表 X 轴
// ============================================================
function bindZoomBar(chartId) {
  const bar = document.querySelector(`.zoom-bar[data-for="${chartId}"]`);
  if (!bar) return;
  const lo = bar.querySelector('input.zlo');
  const hi = bar.querySelector('input.zhi');
  if (!lo || !hi) return;

  // 双滑块：分别控制左右边界（0..100）
  const MIN_GAP = 1;   // 最小可见宽度（%）

  function onSlide() {
    let a = parseFloat(lo.value);
    let b = parseFloat(hi.value);
    if (a > b - MIN_GAP) {
      // 谁在动就推谁：简单处理——保持 gap
      if (document.activeElement === lo) { b = Math.min(100, a + MIN_GAP); hi.value = b; }
      else { a = Math.max(0, b - MIN_GAP); lo.value = a; }
    }
    const meta = chartMeta[chartId];
    if (!meta) return;
    meta.viewStart = a / 100;
    meta.viewEnd = b / 100;
    scheduleUpdate(chartId);
  }
  lo.addEventListener('input', onSlide);
  hi.addEventListener('input', onSlide);

  // 鼠标滚轮缩放（在图表区域上），以光标为中心
  const canvas = document.getElementById(chartId);
  if (canvas) {
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.04 : -0.04;  // 向下缩小/向上放大
      const meta = chartMeta[chartId];
      if (!meta || !allRows.length) return;
      const span = meta.viewEnd - meta.viewStart;
      const newSpan = Math.max(0.02, Math.min(1, span + delta));
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;  // 0..1 相对位置
      const center = meta.viewStart + span * mx;
      meta.viewStart = Math.max(0, center - newSpan * mx);
      meta.viewEnd = Math.min(1, center + newSpan * (1 - mx));
      syncSlider(chartId);
      scheduleUpdate(chartId);
    }, {passive:false});
  }

  // 拖拽平移（在图表上按住拖动）
  let dragging = false, dragStartX = 0, s0 = 0, span0 = 0;
  if (canvas) {
    canvas.addEventListener('mousedown', (e) => {
      const meta = chartMeta[chartId];
      if (!meta) return;
      dragging = true; dragStartX = e.clientX;
      s0 = meta.viewStart; span0 = meta.viewEnd - meta.viewStart;
      e.preventDefault();
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const meta = chartMeta[chartId];
      if (!meta) return;
      const dx = (e.clientX - dragStartX) / (canvas.clientWidth || 400);
      let ns = s0 - dx * span0;
      let ne = ns + span0;
      if (ns < 0) { ne -= ns; ns = 0; }
      if (ne > 1) { ns -= (ne - 1); ne = 1; }
      meta.viewStart = Math.max(0, ns);
      meta.viewEnd = Math.min(1, ne);
      syncSlider(chartId);
      scheduleUpdate(chartId);
    });
    canvas.addEventListener('mouseup', () => dragging = false);
    canvas.addEventListener('mouseleave', () => dragging = false);
  }
}

function syncSlider(chartId) {
  const bar = document.querySelector(`.zoom-bar[data-for="${chartId}"]`);
  const lo = bar?.querySelector('input.zlo');
  const hi = bar?.querySelector('input.zhi');
  if (!lo || !hi) return;
  const meta = chartMeta[chartId];
  if (!meta) return;
  lo.value = (meta.viewStart * 100).toFixed(1);
  hi.value = (meta.viewEnd * 100).toFixed(1);
}

// 缩放按钮（以中心为锚点扩大/缩小区间）
function zoomOut(btn) {
  const chartId = btn.closest('.zoom-bar').dataset.for;
  const meta = chartMeta[chartId];
  if (!meta) return;
  const center = (meta.viewStart + meta.viewEnd) / 2;
  const span = Math.min(1, (meta.viewEnd - meta.viewStart) * 1.5);
  meta.viewStart = Math.max(0, center - span/2);
  meta.viewEnd = Math.min(1, center + span/2);
  syncSlider(chartId);
  scheduleUpdate(chartId);
}
function zoomIn(btn) {
  const chartId = btn.closest('.zoom-bar').dataset.for;
  const meta = chartMeta[chartId];
  if (!meta) return;
  const center = (meta.viewStart + meta.viewEnd) / 2;
  const span = Math.max(0.02, (meta.viewEnd - meta.viewStart) / 1.5);
  meta.viewStart = Math.max(0, center - span/2);
  meta.viewEnd = Math.min(1, center + span/2);
  syncSlider(chartId);
  scheduleUpdate(chartId);
}
function resetZoom(btn) {
  const chartId = btn.closest('.zoom-bar').dataset.for;
  const meta = chartMeta[chartId];
  if (!meta) return;
  meta.viewStart = 0;
  meta.viewEnd = 1;
  syncSlider(chartId);
  scheduleUpdate(chartId);
}

// ============================================================
// 节流更新：同一帧内合并多次调用
// ============================================================
function scheduleUpdate(chartId) {
  if (rafPending) return;
  rafPending = requestAnimationFrame(() => {
    rafPending = null;
    refreshAllCharts();
  });
}

function refreshAllCharts() {
  Object.keys(charts).forEach(id => {
    if (id) refreshChart(id);
  });
}

function refreshChart(id) {
  const ch = charts[id];
  const meta = chartMeta[id];
  if (!ch || !meta.keys.length) return;

  const n = meta.fullLabels.length;
  const loI = Math.floor(meta.viewStart * (n - 1));
  const hiI = Math.ceil(meta.viewEnd * (n - 1));

  // 提取可见区间并降采样
  const visibleLabels = meta.fullLabels.slice(loI, hiI + 1);
  const visibleTs = meta.fullTs.slice(loI, hiI + 1);

  ch.data.labels = visibleLabels;
  ch.data.datasets.forEach((ds, i) => {
    const key = meta.keys[i];
    if (!key) return;
    const arr = meta.fullData[i];
    if (!arr) return;
    const sliced = arr.slice(loI, hiI + 1);
    // 降采样
    const sampled = downsample(sliced, visibleLabels, visibleTs, MAX_DISPLAY_POINTS);
    ds.data = sampled.data;
    ds._rawTs = sampled.ts;
  });

  // Y 轴贴合可见区间
  fitYAxis(ch);

  ch.update('none');  // v4: 'none' 关闭动画，不触发事件回调，避免循环
}

function fitYAxis(ch) {
  let lo = Infinity, hi = -Infinity;
  ch.data.datasets.forEach(ds => {
    for (const v of ds.data) {
      if (v == null || isNaN(v)) continue;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
  });
  if (lo === Infinity) return;
  const pad = ((hi - lo) || Math.abs(hi) || 1) * 0.08;
  ch.options.scales.y.min = lo - pad;
  ch.options.scales.y.max = hi + pad;
}

// ============================================================
// 数据加载
// ============================================================
async function loadPoster(){
  try {
    const res = await fetch('eval_poster.png?t='+Date.now());
    if(!res.ok) throw 0;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const img = document.getElementById('posterImg');
    img.src = url;
    img.onload = ()=>URL.revokeObjectURL(url);
  }catch(e){}
}

async function load(){
  try {
    const res = await fetch('train_data.json?t='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    document.getElementById('meta').textContent =
      `${data.source||''} · ${data.pulledAt||''} · ${data.count||0} 条`;

    allRows = data.rows || [];
    if (!allRows.length) return;

    // 首次创建图表
    if (!chartsBuilt) {
      makeChart('diffChart', [
        {label:'Diff', color:COLORS.diff, key:'diff'}
      ]);
      makeChart('totalChart', [
        {label:'Total', color:COLORS.total, key:'total'}
      ]);
      makeChart('structChart', [
        {label:'Canny', color:COLORS.canny, key:'canny'},
        {label:'Skel', color:COLORS.skel, key:'skel'},
        {label:'REPA', color:COLORS.repa, key:'repa'}
      ]);
      makeChart('mseChart', [
        {label:'MSE', color:COLORS.warn, key:'mse'}
      ]);
      makeChart('ssimChart', [
        {label:'SSIM', color:COLORS.ok, key:'ssim'}
      ]);
      makeChart('x0Chart', [
        {label:'X0Lat', color:COLORS.total, key:'x0lat'}
      ]);
      makeChart('spdChart', [
        {label:'Steps/Sec', color:COLORS.spd, key:'stepsPerSec'}
      ]);
      makeChart('memChart', [
        {label:'当前', color:COLORS.canny, key:'memCur'},
        {label:'峰值', color:COLORS.skel, key:'memPeak'}
      ]);
      chartsBuilt = true;
    }

    // 存储全量数据到 meta：fullData 按 dataset 顺序存数组
    Object.values(charts).forEach(ch => {
      const id = ch.canvas.id;
      const m = chartMeta[id];
      m.fullLabels = allRows.map(r => r.step);
      m.fullTs = allRows.map(r => r.ts || '');
      m.fullData = m.keys.map(key => allRows.map(r => r[key]));
    });

    // 刷新所有图表
    refreshAllCharts();

    // 统计卡片
    renderStats(allRows);
    loadPoster();

  } catch(e){
    document.getElementById('meta').textContent = '加载失败: '+e.message;
  }
}

// ============================================================
// 统计卡片
// ============================================================
function renderStats(rows){
  const last = rows[rows.length-1];
  const nan = v=>v==null||isNaN(v);
  const s=(k,v,c)=>`<div class="stat"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`;

  const hasEval = !nan(last.mse);
  const finite = rows.filter(r=>!nan(r.diff));
  const firstD = finite.length?finite[0].diff:null;
  const trend = (firstD!=null&&!nan(last.diff))?((last.diff-firstD)/firstD*100):null;

  let statusText = '正常';
  if(hasEval) statusText = 'auto-eval';
  else if(nan(last.diff)) statusText = 'NaN';
  else if(!nan(last.diff)&&finite.length>5&&last.diff<finite[0].diff) statusText = '下降中';

  document.getElementById('statGrid').innerHTML =
    s('Step', last.step) +
    s('Diff', nan(last.diff)?'—':last.diff.toFixed(4), nan(last.diff)?'warn':'') +
    s('Diff Δ', trend==null?'—':(trend>0?'+':'')+trend.toFixed(1)+'%', (trend!=null&&trend<0)?'ok':'') +
    s('MSE', nan(last.mse)?'—':last.mse.toFixed(5)) +
    s('SSIM', nan(last.ssim)?'—':last.ssim.toFixed(4), nan(last.ssim)?'':'ok') +
    s('Steps/s', nan(last.stepsPerSec)?'—':last.stepsPerSec.toFixed(1)) +
    s('状态', statusText, statusText==='NaN'?'warn':(statusText==='auto-eval'||statusText==='下降中'?'ok':''));

  // 状态行
  let st = '';
  if(!hasEval&&!nan(last.diff))
    st += 'Diff '+(firstD!=null?firstD.toFixed(4):'→')+' → '+last.diff.toFixed(4);
  else if(hasEval)
    st += 'MSE='+last.mse.toFixed(5)+' SSIM='+last.ssim.toFixed(4);
  document.getElementById('statusLine').textContent = st || '等待数据…';
}

// ============================================================
// Tab 切换
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
    // 切换 tab 后重绘所有图表（确保隐藏 tab 的 Canvas 尺寸正确恢复）
    requestAnimationFrame(() => {
      Object.keys(charts).forEach(id => {
        if (id && charts[id]) charts[id].resize();
      });
      refreshAllCharts();
    });
  });
});

// ============================================================
// 自动刷新 & 倒计时
// ============================================================
document.getElementById('refreshBtn').addEventListener('click', load);
let secLeft = 10, timer=null, cdTimer=null;
const autoChk=document.getElementById('autoChk');
function tick(){
  secLeft = secLeft<=0?10:secLeft-1;
  const el=document.getElementById('countdown');
  if(el) el.textContent = autoChk.checked?`下次 ${secLeft}s`:'已关闭';
}
function syncAuto(){
  if(autoChk.checked){
    if(!timer) timer=setInterval(load, REFRESH_MS);
    if(!cdTimer){secLeft=10;cdTimer=setInterval(tick,1000);}
  }else{
    if(timer){clearInterval(timer);timer=null;}
    if(cdTimer){clearInterval(cdTimer);cdTimer=null;}
    const el=document.getElementById('countdown');
    if(el) el.textContent='已关闭';
  }
}
autoChk.addEventListener('change', syncAuto);

// 启动
load();
syncAuto();
</script>
